<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script>
(function () {
  var options = {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
      { left: '$', right: '$', display: false }
    ],
    throwOnError: false
  };
  var rendered = false;
  function renderMath() {
    if (rendered || typeof window.renderMathInElement !== 'function' || typeof window.katex !== 'object' || !document.body) return false;
    try {
      window.renderMathInElement(document.body, options);
      rendered = true;
    } catch (error) {
      return false;
    }
    return true;
  }
  function waitForRenderer(attempts) {
    if (!renderMath() && attempts > 0) {
      window.setTimeout(function () { waitForRenderer(attempts - 1); }, 50);
    }
  }
  window.renderSiteMath = function () { waitForRenderer(100); };
  document.addEventListener('DOMContentLoaded', function () { waitForRenderer(100); }, { once: true });
  window.addEventListener('load', function () { waitForRenderer(20); }, { once: true });
})();
</script>
<script async src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.renderSiteMath && window.renderSiteMath()"></script>
<script async src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="window.renderSiteMath && window.renderSiteMath()"></script>
{% endif %}
