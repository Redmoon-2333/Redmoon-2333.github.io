<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  'use strict';
  if (window.siteTheme) return;
  var key = 'redmoon-theme';
  var root = document.documentElement;
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  var preference = 'system';
  var control;
  function normalize(value) {
    return value === 'light' || value === 'dark' ? value : 'system';
  }
  try { preference = normalize(window.localStorage.getItem(key)); } catch (error) {}
  function apply() {
    root.dataset.theme = preference === 'system' ? (media.matches ? 'dark' : 'light') : preference;
    root.dataset.themePreference = preference;
    if (control) control.value = preference;
  }
  function select(value) {
    preference = normalize(value);
    apply();
    try { window.localStorage.setItem(key, preference); } catch (error) {}
  }
  window.siteTheme = { select: select };
  apply();
  function systemChanged() {
    if (preference === 'system') apply();
  }
  if (media.addEventListener) media.addEventListener('change', systemChanged);
  else media.addListener(systemChanged);
  window.addEventListener('storage', function (event) {
    if (event.key === key || event.key === null) {
      preference = normalize(event.newValue);
      apply();
    }
  });
  document.addEventListener('DOMContentLoaded', function () {
    control = document.getElementById('theme-select');
    if (!control) return;
    control.value = preference;
    control.addEventListener('change', function () { select(control.value); });
    control.closest('.theme-control').hidden = false;
  }, { once: true });
})();
</script>

{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script>
(function () {
  var options = {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
      { left: '$', right: '$', display: false }
    ],
    throwOnError: false
  };
  var rendered = false;
  function renderMath() {
    if (rendered || typeof window.renderMathInElement !== 'function' || typeof window.katex !== 'object' || !document.body) return false;
    try {
      window.renderMathInElement(document.body, options);
      rendered = true;
    } catch (error) {
      return false;
    }
    return true;
  }
  function waitForRenderer(attempts) {
    if (!renderMath() && attempts > 0) {
      window.setTimeout(function () { waitForRenderer(attempts - 1); }, 50);
    }
  }
  window.renderSiteMath = function () { waitForRenderer(100); };
  document.addEventListener('DOMContentLoaded', function () { waitForRenderer(100); }, { once: true });
  window.addEventListener('load', function () { waitForRenderer(20); }, { once: true });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
{% endif %}
