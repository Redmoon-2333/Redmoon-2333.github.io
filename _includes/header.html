<a class="skip-link" href="#main">跳到内容</a>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
      <span class="brand-mark" aria-hidden="true">∇</span>
      <span class="brand-name">{{ site.name | default: 'RedMoon' }}</span>
      <span class="brand-sub">/ 训练日志</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="{{ '/papers/' | relative_url }}" {% if page.url == '/papers/' %}class="active" aria-current="page"{% endif %}>论文</a>
      <a href="{{ '/practice/' | relative_url }}" {% if page.url == '/practice/' %}class="active" aria-current="page"{% endif %}>实践</a>
      <a href="{{ '/courses/' | relative_url }}" {% if page.url == '/courses/' %}class="active" aria-current="page"{% endif %}>课堂</a>
      <a href="{{ '/notes/' | relative_url }}" {% if page.url == '/notes/' %}class="active" aria-current="page"{% endif %}>见闻</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}class="active" aria-current="page"{% endif %}>全部</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active" aria-current="page"{% endif %}>关于</a>
      {% if site.github_username and site.github_username != 'YOUR_GITHUB_USERNAME' %}
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener">GitHub</a>
      {% else %}
      <a href="https://github.com/" rel="noopener">GitHub</a>
      {% endif %}
    </nav>
  </div>
</header>
<main id="main" class="wrap">
