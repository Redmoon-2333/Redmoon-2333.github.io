<svg class="diagram" role="img" aria-label="recurrence" viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><text x="0" y="22" text-anchor="start" font-size="18" style="fill:#18201e">a：n⁴ → n⁴/8 → n⁴/64</text><text x="0" y="49" text-anchor="start" font-size="15" style="fill:#246b56">逐层缩小，根部主导</text><text x="0" y="82" text-anchor="start" font-size="18" style="fill:#18201e">c：n² → n² → n²</text><text x="0" y="109" text-anchor="start" font-size="15" style="fill:#246b56">各层相同，乘上对数层数</text><text x="0" y="142" text-anchor="start" font-size="18" style="fill:#18201e">e：n² → 7n²/4 → 49n²/16</text><text x="0" y="169" text-anchor="start" font-size="15" style="fill:#246b56">逐层增大，叶部主导</text></svg>
