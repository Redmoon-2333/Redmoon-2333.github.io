<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2933"/>
    </marker>
    <style>
      .title { font: 700 25px 'Microsoft YaHei', sans-serif; fill: #1f2933; }
      .subtitle { font: 15px 'Microsoft YaHei', sans-serif; fill: #56616f; }
      .box { stroke: #1f2933; stroke-width: 1.5; rx: 10; ry: 10; }
      .label { font: 600 17px 'Microsoft YaHei', sans-serif; fill: #1f2933; text-anchor: middle; }
      .small { font: 14px 'Microsoft YaHei', sans-serif; fill: #56616f; text-anchor: middle; }
      .note { font: 13px 'Microsoft YaHei', sans-serif; fill: #56616f; }
      .arrow { stroke: #1f2933; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fafaf7"/>
  
<text x="600" y="42" class="title" text-anchor="middle">同一个 Bigram 目标，两种参数化路径</text>
<text x="600" y="70" class="subtitle" text-anchor="middle">两边都要输出 P(next | current)，差别在于概率从哪里来</text>
<text x="285" y="115" class="label">直接计数模型</text>
<text x="915" y="115" class="label">可训练神经网络模型</text>
<rect x="100" y="145" width="370" height="64" fill="#dcecff" class="box"/><text x="285" y="184" class="label">名字数据 → 计数矩阵 N</text>
<rect x="100" y="265" width="370" height="64" fill="#ddf4e6" class="box"/><text x="285" y="304" class="label">N + 1 → 按行归一化</text>
<rect x="100" y="385" width="370" height="64" fill="#fff1d6" class="box"/><text x="285" y="424" class="label">P(next | current)</text>
<path d="M285 210 L285 262" class="arrow"/><path d="M285 330 L285 382" class="arrow"/>
<rect x="730" y="145" width="370" height="64" fill="#dcecff" class="box"/><text x="915" y="184" class="label">one-hot(current) × W</text>
<rect x="730" y="265" width="370" height="64" fill="#fbe4e4" class="box"/><text x="915" y="304" class="label">logits → exp → 行归一化</text>
<rect x="730" y="385" width="370" height="64" fill="#fff1d6" class="box"/><text x="915" y="424" class="label">P(next | current)</text>
<path d="M915 210 L915 262" class="arrow"/><path d="M915 330 L915 382" class="arrow"/>
<path d="M470 417 C560 417, 640 417, 730 417" class="arrow"/>
<text x="600" y="405" class="small">相同的条件概率目标</text>
<rect x="450" y="505" width="300" height="64" fill="#fbe4e4" class="box"/><text x="600" y="532" class="label">真实目标概率 → NLL loss</text><text x="600" y="553" class="small">训练时最小化，生成时按概率采样</text>
<path d="M285 450 C340 500, 395 530, 447 535" class="arrow"/><path d="M915 450 C860 500, 805 530, 753 535" class="arrow"/>
<text x="44" y="616" class="note">关键桥梁：当 W 的每一行经过 softmax 后与平滑计数的行分布一致时，两种模型给出同一套下一个字符概率。</text>
</svg>