<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">随机选择只递归目标所在的一侧</title>
  <desc id="desc">以数组 3,9,10,1,6 为例，取 3 为基准数，目标是第 3 小的数，进入右侧继续找第 1 小。</desc>
  <style>
    .ink{fill:#173b72;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .small{font-size:24px}.mid{font-size:30px}.big{font-size:38px;font-weight:700}
    .box{fill:#fffdf7;stroke:#244e87;stroke-width:3}.soft{fill:#eef5ff;stroke:#244e87;stroke-width:3}
    .hot{fill:#fff2a8;stroke:#c98919;stroke-width:3}.line{stroke:#244e87;stroke-width:4;fill:none}
  </style>
  <rect width="1200" height="430" fill="#fbfaf5"/>
  <text x="56" y="58" class="ink big">随机快选：只沿着目标所在的一侧继续</text>
  <text x="56" y="100" class="ink mid">例：A=[3,9,10,1,6]，要找第 k=3 小的数</text>

  <text x="74" y="160" class="ink mid">取基准数 x=3</text>
  <rect x="74" y="188" width="94" height="64" rx="8" class="hot"/><text x="108" y="231" class="ink big">1</text>
  <rect x="180" y="188" width="94" height="64" rx="8" class="hot"/><text x="214" y="231" class="ink big">3</text>
  <rect x="286" y="188" width="94" height="64" rx="8" class="soft"/><text x="320" y="231" class="ink big">6</text>
  <rect x="392" y="188" width="94" height="64" rx="8" class="soft"/><text x="426" y="231" class="ink big">9</text>
  <rect x="498" y="188" width="94" height="64" rx="8" class="soft"/><text x="532" y="231" class="ink big">10</text>
  <text x="90" y="294" class="ink small">L：1 个</text>
  <text x="202" y="294" class="ink small">x</text>
  <text x="365" y="294" class="ink small">G：3 个</text>

  <path d="M650 220 H742" class="line"/>
  <path d="M732 208 L750 220 L732 232" class="line"/>
  <text x="650" y="172" class="ink mid">k=3</text>
  <text x="650" y="270" class="ink small">左侧只有 1 个，比 k−1 小</text>
  <text x="650" y="304" class="ink small">所以答案在 G 中，新的排名为</text>
  <text x="650" y="348" class="ink big">k−|L|−1 = 1</text>

  <rect x="860" y="166" width="270" height="148" rx="12" class="soft"/>
  <text x="888" y="210" class="ink mid">递归处理 G</text>
  <text x="888" y="252" class="ink mid">[6,9,10] 中找第 1 小</text>
  <text x="888" y="298" class="ink big">答案：6</text>
  <path d="M995 322 V374" class="line"/>
  <path d="M983 364 L995 382 L1007 364" class="line"/>
  <text x="818" y="414" class="ink small">每一轮扫描 O(n)，但只保留一条递归路径</text>
</svg>
