<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">五个一组与 3n/10 的划分保证</title>
  <desc id="desc">把元素分成五个一组，取每组中位数，再取这些中位数的中位数 x，说明至少 3n/10 个元素位于 x 的两侧。</desc>
  <style>
    .ink{fill:#173b72;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .small{font-size:23px}.mid{font-size:29px}.big{font-size:36px;font-weight:700}
    .cell{fill:#fffdf7;stroke:#244e87;stroke-width:3}.med{fill:#fff2a8;stroke:#c98919;stroke-width:4}
    .arrow{stroke:#244e87;stroke-width:4;fill:none}.dash{stroke:#9a5b2b;stroke-width:3;stroke-dasharray:8 8}
  </style>
  <rect width="1200" height="620" fill="#fbfaf5"/>
  <text x="48" y="52" class="ink big">为什么每次至少能排除约 3n/10 个元素？</text>
  <text x="48" y="91" class="ink mid">五个一组 → 取组中位数 → 再取这些中位数的中位数 x</text>

  <text x="62" y="143" class="ink mid">原数组 A（每行是一组）</text>
  <g transform="translate(64,166)">
    <g>
      <rect x="0" y="0" width="92" height="56" class="cell"/><text x="36" y="38" class="ink mid">1</text>
      <rect x="100" y="0" width="92" height="56" class="cell"/><text x="136" y="38" class="ink mid">4</text>
      <rect x="200" y="0" width="92" height="56" class="med"/><text x="236" y="38" class="ink mid">7</text>
      <rect x="300" y="0" width="92" height="56" class="cell"/><text x="336" y="38" class="ink mid">9</text>
      <rect x="400" y="0" width="92" height="56" class="cell"/><text x="430" y="38" class="mid ink">12</text>
    </g>
    <g transform="translate(0,72)">
      <rect x="0" y="0" width="92" height="56" class="cell"/><text x="36" y="38" class="ink mid">2</text>
      <rect x="100" y="0" width="92" height="56" class="cell"/><text x="136" y="38" class="ink mid">5</text>
      <rect x="200" y="0" width="92" height="56" class="med"/><text x="236" y="38" class="ink mid">8</text>
      <rect x="300" y="0" width="92" height="56" class="cell"/><text x="336" y="38" class="ink mid">11</text>
      <rect x="400" y="0" width="92" height="56" class="cell"/><text x="430" y="38" class="mid ink">15</text>
    </g>
    <g transform="translate(0,144)">
      <rect x="0" y="0" width="92" height="56" class="cell"/><text x="36" y="38" class="ink mid">3</text>
      <rect x="100" y="0" width="92" height="56" class="cell"/><text x="136" y="38" class="ink mid">6</text>
      <rect x="200" y="0" width="92" height="56" class="med"/><text x="236" y="38" class="ink mid">10</text>
      <rect x="300" y="0" width="92" height="56" class="cell"/><text x="336" y="38" class="ink mid">13</text>
      <rect x="400" y="0" width="92" height="56" class="cell"/><text x="430" y="38" class="mid ink">16</text>
    </g>
    <text x="0" y="238" class="ink small">每组黄色格是组中位数</text>
  </g>

  <path d="M590 245 H690" class="arrow"/>
  <path d="M678 233 L698 245 L678 257" class="arrow"/>
  <text x="575" y="185" class="ink mid">中位数数组 D</text>
  <rect x="568" y="210" width="92" height="56" class="med"/><text x="604" y="248" class="ink mid">7</text>
  <rect x="668" y="210" width="92" height="56" class="med"/><text x="704" y="248" class="ink mid">8</text>
  <rect x="768" y="210" width="92" height="56" class="med"/><text x="804" y="248" class="ink mid">10</text>
  <text x="596" y="300" class="ink small">递归取 D 的中位数：x=8</text>

  <path d="M856 340 H1050" class="dash"/>
  <text x="858" y="328" class="ink mid">x=8</text>
  <text x="58" y="424" class="ink mid">对每个“中位数 ≥ x”的五元组：</text>
  <text x="58" y="465" class="ink small">组中至少有 3 个元素 ≥ x；约有 n/10 组满足条件</text>
  <text x="58" y="505" class="ink big">所以至少 3·(n/10)=3n/10 个元素 ≥ x</text>
  <text x="58" y="552" class="ink small">另一侧同理：至少 3n/10 个元素 ≤ x，递归的一侧至多 7n/10+O(1)</text>
  <circle cx="1006" cy="463" r="12" fill="#fff2a8" stroke="#c98919" stroke-width="4"/>
  <circle cx="1047" cy="463" r="12" fill="#fff2a8" stroke="#c98919" stroke-width="4"/>
  <circle cx="1088" cy="463" r="12" fill="#fff2a8" stroke="#c98919" stroke-width="4"/>
</svg>
